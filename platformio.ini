; Guition JC4827W543C: ESP32-S3 N4R8 + NV3041A (QSPI, 480x272) + GT911 touch
; LVGL 9 + GFX Library for Arduino, Arduino framework

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool

board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi   ; N4R8: quad flash + octal PSRAM

; ArduinoJson 7, PubSubClient 2.8 and TouchLib (GT911) are vendored in lib/
lib_deps =
	lvgl/lvgl@9.2.2
	; 1.4.9 is the last release for Arduino-ESP32 2.x (espressif32 6.x); 1.5+ needs core 3.x
	moononournation/GFX Library for Arduino@1.4.9
	tzapu/WiFiManager@2.0.17

monitor_filters =
	esp32_exception_decoder
	time

build_flags =
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=1

; Host-side unit tests for the pure parsers: `pio test -e native`
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<parsers.cpp>
build_flags = -std=c++17 -I src
lib_deps =
lib_ldf_mode = chain
lib_ignore = PubSubClient, TouchLib, lvgl, GFX Library for Arduino
